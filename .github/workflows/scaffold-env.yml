name: Scaffold GitOps Environment

on:
  workflow_dispatch:
    inputs:
      port_context:
        required: true
        type: string
      service_name:
        description: "Service name (must match existing service repo)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  scaffold-env:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_ORG_TOKEN }}
      SERVICE_NAME: ${{ inputs.service_name }}
      ORG: ${{ github.repository_owner }}
      PORT_RUN_ID: ${{ fromJson(inputs.port_context).runId }}
      PORT_BASE_URL: ${{ secrets.PORT_BASE_URL != '' && secrets.PORT_BASE_URL || 'https://api.port.io' }}

    steps:
      - name: Checkout platform-idp
        uses: actions/checkout@v4

      - name: Authenticate to Port API
        id: port_auth
        shell: bash
        run: |
          set -euo pipefail

          ACCESS_TOKEN=$(
            curl -sS -X POST "${PORT_BASE_URL}/v1/auth/access_token" \
              -H "Content-Type: application/json" \
              -d "{\"clientId\":\"${{ secrets.PORT_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.PORT_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken'
          )

          if [[ -z "$ACCESS_TOKEN" || "$ACCESS_TOKEN" == "null" ]]; then
            echo "Failed to get Port access token"; exit 1
          fi

          echo "PORT_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Register Port run link
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_BASE_URL }}
          operation: PATCH_RUN
          runId: ${{ env.PORT_RUN_ID }}
          statusLabel: "Scaffold GitOps started"
          link: |
            ["${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"]

      - name: Clone platform-env
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${ORG}/platform-env.git" /tmp/platform-env

      - name: Run make scaffold-env
        shell: bash
        run: |
          set -euo pipefail

          port_log() {
            curl -sS -X POST "${PORT_BASE_URL}/v1/actions/runs/${PORT_RUN_ID}/logs" \
              -H "Authorization: Bearer ${PORT_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg message "$1" '{message: $message}')" > /dev/null
          }

          port_log "Running make scaffold-env for '${SERVICE_NAME}'"

          make scaffold-env \
            SERVICE_NAME="${SERVICE_NAME}" \
            ENV_REPO_DIR="/tmp/platform-env"

          port_log "GitOps manifests generated successfully"

      - name: Push PR to platform-env
        shell: bash
        run: |
          set -euo pipefail

          port_log() {
            curl -sS -X POST "${PORT_BASE_URL}/v1/actions/runs/${PORT_RUN_ID}/logs" \
              -H "Authorization: Bearer ${PORT_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg message "$1" '{message: $message}')" > /dev/null
          }

          cd /tmp/platform-env
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add .
          if git diff --cached --quiet; then
            port_log "No changes detected for ${SERVICE_NAME} — files already up to date"
            echo "PR_URL=" >> "$GITHUB_ENV"
            exit 0
          fi

          BRANCH="scaffold/${SERVICE_NAME}-gitops"
          git checkout -b "$BRANCH"
          git commit -m "feat: scaffold GitOps app/values for ${SERVICE_NAME}"
          git push -u origin "$BRANCH"

          PR_BODY="ArgoCD Application + Helm values for ${SERVICE_NAME} across dev/staging/prod. Generated by Port self-service action."

          PR_URL=$(gh pr create \
            --repo "${ORG}/platform-env" \
            --base main \
            --head "$BRANCH" \
            --title "feat: scaffold GitOps for ${SERVICE_NAME}" \
            --body "$PR_BODY")

          echo "PR_URL=${PR_URL}" >> "$GITHUB_ENV"
          port_log "Pull request created: ${PR_URL}"

      - name: Finalize success in Port
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          curl -sS -X PATCH "${PORT_BASE_URL}/v1/actions/runs/${PORT_RUN_ID}" \
            -H "Authorization: Bearer ${PORT_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg status "SUCCESS" \
              --arg statusLabel "GitOps scaffold completed" \
              --arg summary "PR: ${PR_URL:-N/A}" \
              --arg link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{status: $status, statusLabel: $statusLabel, summary: $summary, link: [$link]}')"

          curl -sS -X POST "${PORT_BASE_URL}/v1/actions/runs/${PORT_RUN_ID}/logs" \
            -H "Authorization: Bearer ${PORT_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg message "GitOps scaffold completed successfully" \
              --arg terminationStatus "SUCCESS" \
              '{message: $message, terminationStatus: $terminationStatus}')"

      - name: Finalize failure in Port
        if: failure()
        shell: bash
        run: |
          set -euo pipefail

          curl -sS -X PATCH "${PORT_BASE_URL}/v1/actions/runs/${PORT_RUN_ID}" \
            -H "Authorization: Bearer ${PORT_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg statusLabel "GitOps scaffold failed" \
              --arg link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{statusLabel: $statusLabel, link: [$link]}')"

          curl -sS -X POST "${PORT_BASE_URL}/v1/actions/runs/${PORT_RUN_ID}/logs" \
            -H "Authorization: Bearer ${PORT_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg message "GitOps scaffold failed. Check GitHub Actions logs." \
              --arg terminationStatus "FAILURE" \
              '{message: $message, terminationStatus: $terminationStatus}')"
