# Reusable workflow for platform services
# Call from service repo: workflows: 'platform-idp/shared/ci/.github/workflows/platform-service.yml'

name: Platform Service CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      runtime:
        required: true
        type: string
        default: go
      env_repo:
        required: false
        type: string
        default: ""
    secrets:
      registry_token:
        required: false
      env_repo_token:
        required: false

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: pip install --disable-pip-version-check pyyaml jsonschema
      - name: Validate service.yaml
        run: python shared/ci/validate-service-yaml.py
      - name: Enforce prod image tag policy
        run: python shared/ci/check-prod-image-tags.py
      - name: Enforce observability test policy
        run: python shared/ci/check-observability-tests.py
      - name: Enforce runtime parity policy
        run: python shared/ci/check-runtime-parity.py

  lint:
    needs: [validate-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Lint
        run: make lint

  test:
    needs: [validate-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Test
        run: make test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build image (local for scan)
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label platform.service=${{ inputs.service_name }} \
            --label platform.runtime=${{ inputs.runtime }} \
            -t local/${{ github.event.repository.name }}:${{ github.sha }} .
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: local/${{ github.event.repository.name }}:${{ github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  publish:
    needs: [build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Login to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token || secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label platform.service=${{ inputs.service_name }} \
            --label platform.runtime=${{ inputs.runtime }} \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ inputs.service_name }}-${{ github.sha }}
          path: sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Cosign sign published image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Cosign verify published image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  update-dev-values:
    needs: [publish]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && inputs.env_repo != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate env repo token
        run: |
          if [ -z "${{ secrets.env_repo_token }}" ]; then
            echo "Missing required secret: env_repo_token"
            echo "Add ENV_REPO_TOKEN in caller repo and map it to env_repo_token."
            exit 1
          fi
      - name: Checkout environment repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ inputs.env_repo }}
          token: ${{ secrets.env_repo_token }}
          path: platform-env

      - name: Update dev values image tag
        run: |
          set -eu
          FILE="platform-env/environments/dev/values/${{ inputs.service_name }}.values.yaml"
          if [ ! -f "$FILE" ]; then
            echo "Missing values file: $FILE"
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          file_path = os.environ["FILE"]
          new_tag = os.environ["NEW_TAG"]
          data = open(file_path, encoding="utf-8").read()
          data, n = re.subn(r'(^\s*tag:\s*).+$', r'\1"' + new_tag + '"', data, flags=re.M)
          if n == 0:
            raise SystemExit("Could not find image tag line")
          open(file_path, "w", encoding="utf-8").write(data)
          PY
        env:
          FILE: platform-env/environments/dev/values/${{ inputs.service_name }}.values.yaml
          NEW_TAG: ${{ github.sha }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          token: ${{ secrets.env_repo_token }}
          path: platform-env
          commit-message: "gitops: update dev image for ${{ inputs.service_name }} to ${{ github.sha }}"
          branch: "gitops/dev/${{ inputs.service_name }}-${{ github.sha }}"
          title: "gitops: update dev image for ${{ inputs.service_name }}"
          body: |
            Automated dev promotion PR from platform reusable workflow.

            Service: `${{ inputs.service_name }}`
            Environment: `dev`
            Image tag: `${{ github.sha }}`
