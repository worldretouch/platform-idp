# Reusable workflow for platform services
# Call from service repo: workflows: 'platform-idp/shared/ci/.github/workflows/platform-service.yml'

name: Platform Service CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      runtime:
        required: true
        type: string
        default: go
    secrets:
      registry_token:
        required: false

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: pip install --disable-pip-version-check pyyaml jsonschema
      - name: Validate service.yaml
        run: python shared/ci/validate-service-yaml.py

  lint:
    needs: [validate-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: make lint

  test:
    needs: [validate-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (local for scan)
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label platform.service=${{ inputs.service_name }} \
            --label platform.runtime=${{ inputs.runtime }} \
            -t local/${{ github.event.repository.name }}:${{ github.sha }} .
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ github.event.repository.name }}:${{ github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  publish:
    needs: [build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token || secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label platform.service=${{ inputs.service_name }} \
            --label platform.runtime=${{ inputs.runtime }} \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest
