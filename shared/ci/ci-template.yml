# CI Template — Copy to your service repo as .github/workflows/ci.yml
# Customize: service_name, runtime, and build steps per language

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Match shared/ci/example-service-workflow.yml — ceiling for publish (GHCR), CodeQL/SARIF, cosign (id-token)
permissions:
  contents: write
  pull-requests: write
  packages: write
  security-events: write
  id-token: write

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: pip install --disable-pip-version-check pyyaml jsonschema
      - name: Validate service.yaml
        run: python shared/ci/validate-service-yaml.py
      - name: Enforce prod image tag policy
        run: python shared/ci/check-prod-image-tags.py
      - name: Enforce observability test policy
        run: python shared/ci/check-observability-tests.py
      - name: Enforce runtime parity policy
        run: python shared/ci/check-runtime-parity.py

  lint:
    needs: [validate-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Lint
        run: make lint

  test:
    needs: [validate-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Test
        run: make test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build image (local for scan)
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t local/${{ github.event.repository.name }}:${{ github.sha }} .
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: local/${{ github.event.repository.name }}:${{ github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  publish:
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} ghcr.io/${{ github.repository }}:main-latest
          docker push ghcr.io/${{ github.repository }}:main-latest
