# Generated for each service by scaffold: see base-template/.github/workflows/ci.yml
#
# Reusable workflow lives in platform-idp (single source of truth):
#   org/platform-idp/.github/workflows/platform-service.yml@main
#
# Service repo only needs this thin wrapper + secret ENV_REPO_TOKEN (PAT with repo access
# to platform-env for promote flows).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  security-events: write
  id-token: write

jobs:
  platform-ci:
    uses: myorg/platform-idp/.github/workflows/platform-service.yml@main
    with:
      service_name: orders-api
      runtime: go
      env_repo: myorg/platform-env
      platform_repo: myorg/platform-idp
      platform_ref: main
    secrets:
      env_repo_token: ${{ secrets.ENV_REPO_TOKEN }}
