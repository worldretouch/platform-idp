service:
  name: orders-api
  port: 3000
  replicas: 2

image:
  repository: ghcr.io/myorg
  tag: "staging-sha-REPLACE_ME"
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

env:
  APP_ENV: staging
  LOG_LEVEL: info

existingSecret: orders-api-staging-secrets

