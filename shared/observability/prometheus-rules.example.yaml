apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-service-baseline
  namespace: observability
spec:
  groups:
    - name: platform-service.rules
      rules:
        - alert: PlatformServiceHigh5xxRate
          expr: |
            sum(rate(http_server_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_total[5m])), 1)
            > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High 5xx rate on platform service"
        - alert: PlatformServiceP95LatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le)
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "P95 latency above 500ms"

