# Thin wrapper: calls the platform reusable workflow in platform-idp (rendered by make scaffold).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ceiling for the reusable workflow: platform-service.yml job `update-dev-values` needs
# contents:write + pull-requests:write on main (GitOps PR to platform-env). Caller must allow it.
permissions:
  contents: write
  pull-requests: write
  packages: write
  security-events: write
  id-token: write

jobs:
  platform-ci:
    uses: __GITHUB_ORG__/platform-idp/.github/workflows/platform-service.yml@__PLATFORM_REF__
    with:
      service_name: __SERVICE_NAME__
      runtime: __RUNTIME__
      env_repo: __GITHUB_ORG__/platform-env
      platform_repo: __GITHUB_ORG__/platform-idp
      platform_ref: __PLATFORM_REF__
    secrets:
      env_repo_token: ${{ secrets.ENV_REPO_TOKEN }}
